<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3B82F6" />
    <meta
      name="description"
      content="QR Menu Super App - Digital menu ordering for restaurants. Create customizable QR code menus for your restaurant with real-time ordering."
    />
    <title>QR Menu Super App</title>
    <style>
      /* Loading styles for better UX */
      .loading-fallback {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
        color: white;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run this QR Menu Super App.</p>
      </div>
    </noscript>
    <div id="root">
      <div class="loading-fallback">
        <div class="spinner"></div>
        <div>
          <h2 style="margin: 0; font-weight: 600;">QR Menu Super App</h2>
          <p style="margin: 8px 0 0 0; opacity: 0.8;">Loading your digital menu experience...</p>
        </div>
      </div>
    </div>
  </body>
</html>
