services:
  - type: web
    name: qr-menu-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: |
      mkdir -p /opt/render/project/src/media/qr_codes
      mkdir -p /opt/render/project/src/media/menu_items
      mkdir -p /opt/render/project/src/media/restaurant_logos
      python manage.py migrate
      python manage.py ensure_superuser --username=admin --email=admin@qwiks.com --password=admin123
      python manage.py collectstatic --noinput
      gunicorn qr_menu_app.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: SECRET_KEY
        value: "django-insecure-change-this-in-production-12345"
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        value: https://qwiks-frontend.onrender.com
      - key: ALLOWED_HOSTS
        value: qwiks-backend.onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        value: postgresql://root:CbLnpr7Y1Hv2sgcxPbXw0Ft6ff2uco9Q@dpg-d2ld1815pdvs73aipin0-a.oregon-postgres.render.com:5432/qwiks_db
