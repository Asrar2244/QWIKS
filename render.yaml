services:
  - type: static
    name: qr-menu-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build:render
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: CI
        value: false
      - key: REACT_APP_API_URL
        value: https://qwiks-backend.onrender.com/api
      - key: REACT_APP_BACKEND_URL
        value: https://qwiks-backend.onrender.com
      - key: REACT_APP_FRONTEND_URL
        value: https://qwiks-frontend.onrender.com
    # Handle client-side routing - serve index.html for all routes
    routes:
      - type: rewrite
        source: /admin/*
        destination: /index.html
      - type: rewrite
        source: /menu/*
        destination: /index.html
      - type: rewrite
        source: /order-confirmation/*
        destination: /index.html
      - type: rewrite
        source: /test
        destination: /index.html
      # Catch-all route for any unmatched paths
      - type: rewrite
        source: /*
        destination: /index.html
